{
  "project": {
    "name": "explainable-automata-ts",
    "random_seeds": [42, 123, 2026, 7, 999]
  },
  "paths": {
    "data_root": "data",
    "skab_root": "data/SKAB",
    "batadal_training_dataset_2": "data/BATADAL/Training_Dataset_2.csv",
    "outputs": "outputs",
    "logs": "outputs/logs",
    "results": "outputs/results",
    "figures": "outputs/figures"
  },
  "datasets": {
    "skab": {
      "enabled_groups": ["valve1", "valve2"],
      "target_column": "anomaly",
      "excluded_input_columns": ["datetime", "changepoint", "source_group", "source_file"],
      "group_column": "source_file",
      "n_splits": 5,
      "prefer_stratified_group_kfold": true
    },
    "batadal": {
      "target_column": "ATT_FLAG",
      "time_columns": ["DATETIME", "Date", "Time"],
      "split": {
        "train": 0.6,
        "validation": 0.2,
        "test": 0.2
      }
    }
  },
  "preprocessing": {
    "normalization": "standard",
    "automata_pca_components": 1,
    "fit_transforms_on_train_only": true,
    "missing_values": {
      "strategy": "median"
    }
  },
  "automata": {
    "fixed_comparison": {
      "window_size": 4,
      "alphabet_size": 3
    },
    "parameter_grid": {
      "window_size": [3, 4, 5, 6],
      "alphabet_size": [3, 4, 5, 6]
    },
    "paa_segments": null,
    "anomaly_quantile": 0.05,
    "smoothing": 1e-12
  },
  "deep_learning": {
    "models": ["lstm", "gru", "cnn1d"],
    "minimum_required_models": 2,
    "max_epochs": 50,
    "batch_size": 32,
    "learning_rate": 0.001,
    "skab_train_validation_ratio": 0.9,
    "early_stopping": {
      "monitor": "validation_loss",
      "patience": 5
    },
    "lstm": {
      "hidden_size": 64,
      "num_layers": 1,
      "dropout": 0.0
    },
    "gru": {
      "hidden_size": 64,
      "num_layers": 1,
      "dropout": 0.0
    },
    "cnn1d": {
      "channels": 64,
      "kernel_size": 3,
      "dropout": 0.0
    }
  },
  "experiments": {
    "scenarios": ["original", "gaussian_noise", "unseen"],
    "gaussian_noise": {
      "mean": 0.0,
      "std": 0.05
    },
    "metrics": ["accuracy", "precision", "recall", "f1"],
    "output": {
      "max_stored_predictions": 2000,
      "max_stored_explanations": 25
    },
    "visualization": {
      "automata_max_states_in_diagram": 24
    }
  }
}
